<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission LiFE - Carbon Tracker & AI Coach</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .section { margin-bottom: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; border-left: 5px solid #27ae60; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; margin-top: 15px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; }
        button:hover { background: #219653; }
        .result { margin-top: 15px; padding: 10px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 5px; }
        
        /* AI Chat Widget Styling */
        .chat-box { background: #fdfefe; border: 1px solid #d5dbdb; border-radius: 8px; padding: 15px; height: 200px; overflow-y: scroll; margin-bottom: 10px; }
        .chat-message { margin: 8px 0; padding: 8px; border-radius: 5px; }
        .user-msg { background: #e1f5fe; text-align: right; }
        .ai-msg { background: #e8f8f5; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 Mission LiFE Carbon Tracker</h1>
    <p style="text-align: center; color: #7f8c8d;">Track your daily carbon footprint, earn eco-points, and consult your AI Sustainability Coach!</p>

    <!-- Activity Tracker Section -->
    <div class="section">
        <h2>1. Log Your Daily Activity</h2>
        <label>User ID (e.g., 1):</label>
        <input type="number" id="userId" value="1">

        <label>Activity Type:</label>
        <select id="activityType">
            <option value="Transport">Transport</option>
            <option value="Energy">Energy</option>
        </select>

        <label>Action Details:</label>
        <select id="actionDetails">
            <option value="Petrol Car">Petrol Car (192g CO2/km)</option>
            <option value="Public Bus">Public Bus (80g CO2/km)</option>
            <option value="Bicycle">Bicycle (0g CO2 - Eco Friendly!)</option>
            <option value="Electricity">Electricity (820g CO2/unit)</option>
            <option value="Solar">Solar Energy (0g CO2 - Green!)</option>
        </select>

        <label>Quantity (km or Units):</label>
        <input type="number" id="quantity" value="10">

        <button onclick="submitActivity()">Calculate & Save Carbon</button>

        <div id="activityResult" class="result" style="display: none;"></div>
    </div>

    <!-- AI Coach Section -->
    <div class="section" style="border-left-color: #2980b9;">
        <h2>2. Mission LiFE AI Coach (Powered by Groq)</h2>
        <div id="chatBox" class="chat-box">
            <div class="chat-message ai-msg"><b>AI Coach:</b> Hello! Ask me any sustainability tips or how to reduce your carbon footprint.</div>
        </div>
        <input type="text" id="aiInput" placeholder="Ask e.g., How can I reduce plastic use?">
        <button onclick="askAi()" style="background: #2980b9;">Ask Groq AI</button>
    </div>
</div>

<script>
    // Backend API par Activity bhejne ka function
    async function submitActivity() {
        const data = {
            userId: document.getElementById('userId').value,
            activityType: document.getElementById('activityType').value,
            actionDetails: document.getElementById('actionDetails').value,
            quantity: document.getElementById('quantity').value
        };

        try {
            const response = await fetch('/api/carbon/add-activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            const resDiv = document.getElementById('activityResult');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<b>Success!</b> Carbon Emitted: <b>${result.carbonEmittedGrams}g CO2</b> | Eco-Points Earned: <b>+${result.pointsAwarded} pts</b>`;
        } catch (error) {
            alert('Error connecting to backend: ' + error);
        }
    }

    // Groq AI se baat karne ka function
    async function askAi() {
        const input = document.getElementById('aiInput');
        const chatBox = document.getElementById('chatBox');
        const userText = input.value;
        if(!userText) return;

        chatBox.innerHTML += `<div class="chat-message user-msg"><b>You:</b> ${userText}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText })
            });
            const data = await response.json();

            chatBox.innerHTML += `<div class="chat-message ai-msg"><b>AI Coach:</b> ${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="chat-message ai-msg" style="color:red;"><b>Error:</b> Could not reach AI.</div>`;
        }
    }
</script>

</body>
</html>
